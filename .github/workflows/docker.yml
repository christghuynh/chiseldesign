# Builds both production images for linux/amd64 when the deploy setup or the backend dependencies
# change. The backend build runs the CadQuery smoke test (deploy/smoke_cadquery.py). Nothing is pushed.
name: Docker images

on:
  push:
    paths:
      - deploy/**
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/.python-version
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - deploy/**
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/.python-version
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
